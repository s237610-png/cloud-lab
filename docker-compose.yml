version: '3.8'

services:
  backend:
    build: ./server
    container_name: mern-backend
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    networks:
      - mern-network

  frontend:
    build: ./client
    container_name: mern-frontend
    ports:
      - "3000:80"
    networks:
      - mern-network

networks:
  mern-network:
    driver: bridge
